spring.application.name=HookFishing

# ===================== Servidor / Deploy (Render) =====================
# O Render informa a porta na variável PORT; localmente, 8080
server.port=${PORT:8080}
# Atrás do proxy HTTPS do Render: usa X-Forwarded-Proto/Host/For para montar links (HATEOAS, Swagger) com https
# e para enxergar o IP real do cliente (rate limit por IP)
server.forward-headers-strategy=framework

# ===================== Codificação =====================
# Requisições e respostas sempre em UTF-8 (acentos em nomes como "Aquário" e "Faísca")
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===================== Banco H2 =====================
spring.datasource.url=jdbc:h2:mem:fishdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================== JPA =====================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Os services convertem as entidades em DTOs dentro da transação
spring.jpa.open-in-view=false

# ===================== Console do H2 =====================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================== Paginação =====================
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# ===================== Swagger / OpenAPI =====================
# Swagger: /swagger-ui.html redireciona para /swagger-ui/index.html, que exibe a página personalizada
# (tema laranja/azul, seletor de versão e login com e-mail e senha) entregue pelo SwaggerUiFilter
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.default-models-expand-depth=1

# ===================== Parte 2 - Recursos avançados =====================

# API Keys de demonstração criadas ao iniciar (header X-API-Key), uma por papel
# Em produção, troque pelos valores das variáveis de ambiente
hookfishing.api-keys.admin=${HOOKFISHING_ADMIN_KEY:hf_admin_demo_2025}
hookfishing.api-keys.gerente=${HOOKFISHING_GERENTE_KEY:hf_gerente_demo_2025}
hookfishing.api-keys.biologo=${HOOKFISHING_BIOLOGO_KEY:hf_biologo_demo_2025}
hookfishing.api-keys.cuidador=${HOOKFISHING_CUIDADOR_KEY:hf_cuidador_demo_2025}
hookfishing.api-keys.visitante=${HOOKFISHING_VISITANTE_KEY:hf_visitante_demo_2025}

# Rate limiting (token bucket). O limite de cada API Key vem do PLANO dela (model/Plano.java):
#   GRATUITO 20 de uma vez + 30/min | BASICO 60 + 120/min | PROFISSIONAL 200 + 600/min
# Sem chave (rotas públicas), o limite é por IP:
hookfishing.rate-limit.anonimo.capacidade=10
hookfishing.rate-limit.anonimo.recarga-por-minuto=20
# Limite global da API inteira (protege contra muitos clientes ao mesmo tempo)
hookfishing.rate-limit.global.capacidade=1000
hookfishing.rate-limit.global.recarga-por-minuto=3000
# Penalidade: N requisições negadas seguidas (insistir depois do 429) bloqueiam o cliente por X segundos;
# um novo bloqueio dentro da janela de reincidência dobra o tempo, até o máximo
hookfishing.rate-limit.penalidade.tentativas=5
hookfishing.rate-limit.penalidade.segundos=60
hookfishing.rate-limit.penalidade.maximo-segundos=900
hookfishing.rate-limit.penalidade.janela-reincidencia-segundos=600

# Idempotência: por quanto tempo uma X-Idempotency-Key fica registrada
hookfishing.idempotencia.validade-horas=24

# CORS: origens que podem chamar a API pelo navegador (separadas por vírgula).
# Em produção, troque a lista pela variável de ambiente HOOKFISHING_CORS_ORIGINS.
hookfishing.cors.origens-permitidas=${HOOKFISHING_CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://localhost:63342}
# URL pública do serviço, sempre liberada. O Render preenche RENDER_EXTERNAL_URL sozinho
# (ex.: https://hookfishing-api.onrender.com), então o front-end publicado lá funciona sem configurar nada.
hookfishing.cors.url-publica=${RENDER_EXTERNAL_URL:}
