spring.application.name=HookFishing

# ===================== Codificação =====================
# Requisições e respostas sempre em UTF-8 (acentos em nomes como "Aquário" e "Faísca")
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===================== Banco H2 =====================
spring.datasource.url=jdbc:h2:mem:fishdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================== JPA =====================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Os services convertem as entidades em DTOs dentro da transação
spring.jpa.open-in-view=false

# ===================== Console do H2 =====================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================== Paginação =====================
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# ===================== Swagger / OpenAPI =====================
# Swagger: /swagger-ui.html redireciona para /swagger-ui/index.html, que exibe a página personalizada
# (tema laranja/azul, seletor de versão e login com e-mail e senha) entregue pelo SwaggerUiFilter
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.default-models-expand-depth=1

# ===================== Parte 2 - Recursos avançados =====================

# API Keys de demonstração criadas ao iniciar (header X-API-Key), uma por papel
hookfishing.api-keys.admin=hf_admin_demo_2025
hookfishing.api-keys.gerente=hf_gerente_demo_2025
hookfishing.api-keys.biologo=hf_biologo_demo_2025
hookfishing.api-keys.cuidador=hf_cuidador_demo_2025
hookfishing.api-keys.visitante=hf_visitante_demo_2025

# Rate limiting (token bucket) por cliente (API Key ou IP):
# capacidade = máximo de requisições em rajada; recarga = fichas devolvidas ao balde por segundo
hookfishing.rate-limit.capacidade=60
hookfishing.rate-limit.recarga-por-segundo=1

# Idempotência: por quanto tempo uma X-Idempotency-Key fica registrada
hookfishing.idempotencia.validade-horas=24

# CORS: origens que podem chamar a API pelo navegador (separadas por vírgula)
hookfishing.cors.origens-permitidas=http://localhost:3000,http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080
