<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HookFishing API - Documentação</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f07c1f'/%3E%3Cpath d='M7 16c3-4.5 7-6 11-4l5-3v14l-5-3c-4 2-8 .5-11-4z' fill='%23fff'/%3E%3C/svg%3E">
    <!-- Arquivos do Swagger UI servidos pelo próprio springdoc; se não estiverem disponíveis, usa a CDN -->
    <link rel="stylesheet" href="/swagger-ui/swagger-ui.css"
          onerror="this.onerror=null;this.href='https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css'">
    <link rel="stylesheet" href="/css/swagger-tema.css">
    <style>
        /* Bloco com a logo do HookFishing, logo abaixo da barra padrão do Swagger */
        .hf-marca {
            background: #0b3954;
            border-bottom: 4px solid #f07c1f;
            color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .hf-marca__conteudo {
            max-width: 1460px;
            margin: 0 auto;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .hf-marca__logo { display: flex; align-items: center; gap: 12px; }
        .hf-marca__logo strong { display: block; font-size: 19px; letter-spacing: -.01em; }
        .hf-marca__logo span { display: block; font-size: 13px; color: #b9cfe0; }
        .hf-marca__link {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 14px;
            border: 1px solid rgba(255, 255, 255, .35);
            border-radius: 8px;
        }
        .hf-marca__link:hover { border-color: #f07c1f; color: #ffd3ad; }

        #erro-carregamento { max-width: 760px; margin: 40px auto; padding: 16px 20px; border-radius: 10px; background: #fdecea; color: #9b1c1c; display: none; font-family: system-ui, sans-serif; }
    </style>
</head>
<body>

<div id="erro-carregamento">
    Não foi possível carregar o Swagger UI. Verifique se a aplicação está rodando e tente recarregar a página.
</div>

<div id="swagger-ui"></div>

<script>
    (function () {
        'use strict';

        var CDN = 'https://unpkg.com/swagger-ui-dist@5.17.14/';

        var MARCA = ''
            + '<div class="hf-marca__conteudo">'
            + '  <div class="hf-marca__logo">'
            + '    <svg width="40" height="40" viewBox="0 0 32 32" aria-hidden="true">'
            + '      <rect width="32" height="32" rx="7" fill="#f07c1f"/>'
            + '      <path d="M7 16c3-4.5 7-6 11-4l5-3v14l-5-3c-4 2-8 .5-11-4z" fill="#fff"/>'
            + '      <circle cx="12" cy="15" r="1.3" fill="#0b3954"/>'
            + '    </svg>'
            + '    <span><strong>HookFishing API</strong><span>Documentação da API REST de gestão de aquários</span></span>'
            + '  </div>'
            + '  <a class="hf-marca__link" href="/">Abrir aplicação</a>'
            + '</div>';

        function carregarScript(local, reserva) {
            return new Promise(function (resolve, reject) {
                var script = document.createElement('script');
                script.src = local;
                script.onload = resolve;
                script.onerror = function () {
                    var alternativo = document.createElement('script');
                    alternativo.src = reserva;
                    alternativo.onload = resolve;
                    alternativo.onerror = reject;
                    document.head.appendChild(alternativo);
                };
                document.head.appendChild(script);
            });
        }

        // Plugin: mantém a barra padrão do Swagger (logo e "Select a definition") e
        // acrescenta logo abaixo dela o bloco com a logo do HookFishing
        function PluginMarca(system) {
            var React = system.React;
            return {
                wrapComponents: {
                    Topbar: function (Original) {
                        return function (props) {
                            return React.createElement('div', null,
                                React.createElement(Original, props),
                                React.createElement('div', {
                                    className: 'hf-marca',
                                    dangerouslySetInnerHTML: { __html: MARCA }
                                }));
                        };
                    }
                }
            };
        }

        function iniciar() {
            window.ui = SwaggerUIBundle({
                urls: [
                    { url: '/v3/api-docs/v1', name: 'Versão 1' },
                    { url: '/v3/api-docs/v2', name: 'Versão 2' }
                ],
                'urls.primaryName': new URLSearchParams(location.search).get('urls.primaryName') || 'Versão 1',
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
                plugins: [PluginMarca],
                layout: 'StandaloneLayout',
                persistAuthorization: true,
                displayRequestDuration: true,
                tryItOutEnabled: true,
                docExpansion: 'none',
                defaultModelsExpandDepth: 1,
                filter: true
            });
        }

        carregarScript('/swagger-ui/swagger-ui-bundle.js', CDN + 'swagger-ui-bundle.js')
            .then(function () {
                return carregarScript('/swagger-ui/swagger-ui-standalone-preset.js', CDN + 'swagger-ui-standalone-preset.js');
            })
            .then(iniciar)
            .catch(function () {
                document.getElementById('erro-carregamento').style.display = 'block';
            });
    })();
</script>
</body>
</html>
