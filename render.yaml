# Blueprint do Render: New + > Blueprint > selecione este repositório.
# Também dá para criar manualmente: New + > Web Service > Docker (veja o README).
services:
  - type: web
    name: hookfishing-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      # Origens extras liberadas no CORS (front-ends locais de teste). A URL pública do próprio serviço
      # já é liberada automaticamente pela variável RENDER_EXTERNAL_URL, que o Render define sozinho.
      - key: HOOKFISHING_CORS_ORIGINS
        value: http://localhost:3000,http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080
